<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<title>Santtos TV Automation</title>

<link rel="stylesheet" href="style.css">

</head>


<body>

<div class="app">


<header>

<div class="brand">

<h1>Santtos TV</h1>

<span>Automation</span>

</div>


<div id="clock">
00:00:00
</div>


<div class="status">

🟢 SISTEMA ONLINE

|

NDI OFFLINE

</div>


</header>



<div class="layout">


<aside>


<button>📁 Biblioteca</button>

<button>📺 Playlist</button>

<button>🗓 Scheduler</button>

<button>⚙ Configurações</button>


</aside>




<main>


<section class="preview">


<h2>PREVIEW</h2>


<div class="video-screen">

SEM SINAL

</div>


</section>




<section class="air">


<h2>NO AR</h2>


<div class="program">

Nenhum conteúdo

</div>


<div class="time">

00:00:00

</div>


<div class="progress">

<div></div>

</div>


</section>




<section class="next">


<h2>PRÓXIMO</h2>


<div>

Aguardando programação

</div>


</section>




<section class="controls">


<button>
▶ PLAY
</button>


<button>
⏸ PAUSE
</button>


<button>
■ STOP
</button>


</section>




<section class="logs">


<h2>LOGS</h2>


<p>
Sistema iniciado
</p>


</section>



</main>


</div>



<footer>

Santtos TV Automation | Playout v0.1 Alpha

</footer>



</div>



<script src="renderer.js"></script>


</body>

</html>
