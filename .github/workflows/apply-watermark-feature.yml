name: Apply Watermark Feature

on:
  push:
    paths:
      - ".github/workflows/apply-watermark-feature.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply feature migration
        run: python scripts/apply-watermark-feature.py

      - name: Install dependencies
        run: npm ci

      - name: Validate backend syntax
        run: |
          node --check src/database/database.js
          node --check src/main/main.js
          node --check src/main/preload.js

      - name: Build renderer
        run: npm run build:renderer

      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/database/database.js src/main/main.js src/main/preload.js src/renderer/src/App.tsx src/renderer/src/BroadcastSettingsPanel.tsx
          git commit -m "feat: add watermark overlay with timeline continuity"
          git push
