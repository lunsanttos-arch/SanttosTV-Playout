name: Add Daily Playout Report

on:
  push:
    paths:
      - ".github/workflows/add-daily-playout-report.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Excel writer
        run: npm install exceljs@4.4.0 --save

      - name: Apply report integration
        run: python scripts/add-daily-playout-report.py

      - name: Validate backend syntax
        run: |
          node --check src/main/main.js
          node --check src/main/preload.js
          node --check src/core/reporting/playout-report.js

      - name: Build renderer
        run: npm run build:renderer

      - name: Smoke test Excel generation
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const os=require('os');const path=require('path');const r=require('./src/core/reporting/playout-report');const root=fs.mkdtempSync(path.join(os.tmpdir(),'santtos-report-'));r.initializePlayoutReports({userDataPath:path.join(root,'user'),documentsPath:path.join(root,'docs')});const e=r.startPlayoutEntry({id:'test-1',name:'Filme Teste.mp4',path:'C:/media/Filme Teste.mp4',blockLabel:'Bloco 1',inPoint:0,outPoint:10,plannedDurationSeconds:10});r.finishPlayoutEntry(e.id,'EXECUTADO',10);setTimeout(()=>{const dir=path.join(root,'docs','Santtos TV','Relatórios de Exibição');const files=fs.readdirSync(dir).filter(f=>f.endsWith('.xlsx'));if(files.length!==1)process.exit(2);console.log('Excel gerado:',files[0]);},1200);"

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/main/main.js src/main/preload.js src/renderer/src/App.tsx
          git commit -m "feat: generate daily Excel playout execution reports"
          git push
