name: Fix Watermark Upload Crash

on:
  push:
    paths:
      - ".github/workflows/fix-watermark-upload-crash.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply safe upload patch
        run: python scripts/fix-watermark-upload-crash.py
      - name: Install dependencies
        run: npm ci
      - name: Validate backend syntax
        run: |
          node --check src/main/main.js
          node --check src/main/preload.js
      - name: Build renderer
        run: npm run build:renderer
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/main.js src/renderer/src/WatermarkSettingsTab.tsx
          git commit -m "fix: prevent watermark upload from crashing app"
          git push
