name: Add Programmed Time Header

on:
  push:
    paths:
      - ".github/workflows/add-programmed-time-header.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply programmed time header
        run: python scripts/add-programmed-time-header.py
      - name: Install dependencies
        run: npm ci
      - name: Build renderer
        run: npm run build:renderer
      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/App.tsx src/renderer/src/styles.css
          git commit -m "feat: show remaining programmed time and estimated end in header"
          git push
