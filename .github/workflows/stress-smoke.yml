name: Playout Stress Smoke

on:
  push:
    branches: [main]
    paths:
      - "scripts/stress-playout.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/stress-smoke.yml"
  workflow_dispatch:

jobs:
  stress-smoke:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Run accelerated playout stress smoke
        run: npm run stress:smoke

      - name: Upload stress report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-report-smoke
          path: stress-report-smoke.json
          if-no-files-found: warn
