name: Validate Resilient Ingest V2

on:
  push:
    paths:
      - ".github/workflows/validate-resilient-ingest-v2.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply resilient ingest patch
        run: python scripts/apply-resilient-ingest-v2.py

      - name: Install dependencies
        run: npm ci

      - name: Validate syntax
        run: |
          node --check src/main/main.js
          node --check src/main/preload.js
          node --check src/core/media/ffprobe.js
          node --check src/core/media/decode-check.js
          node --check src/database/database.js

      - name: Build renderer
        run: npm run build:renderer

      - name: Generate heterogeneous media matrix
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG="$(node -p "require('ffmpeg-static')")"
          mkdir -p /tmp/santtos-media

          "$FFMPEG" -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=640x360:rate=30000/1001:duration=1" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=1" \
            -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest \
            /tmp/santtos-media/h264.mp4

          "$FFMPEG" -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=720x576:rate=25:duration=1" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=1" \
            -c:v ffv1 -c:a flac -shortest \
            /tmp/santtos-media/ffv1.mkv

          "$FFMPEG" -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=1280x720:rate=24:duration=1" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=1" \
            -c:v prores_ks -profile:v 2 -c:a pcm_s16le -shortest \
            /tmp/santtos-media/prores.mov

          "$FFMPEG" -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=720x480:rate=30000/1001:duration=3" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=3" \
            -c:v mpeg2video -c:a mp2 -shortest -f mpegts \
            /tmp/santtos-media/mpeg2.ts

          "$FFMPEG" -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=640x480:rate=30:duration=1" \
            -f lavfi -i "sine=frequency=440:sample_rate=44100:duration=1" \
            -c:v mpeg4 -c:a mp3 -shortest \
            /tmp/santtos-media/mpeg4.avi

          "$FFMPEG" -hide_banner -loglevel error \
            -f lavfi -i "testsrc2=size=640x360:rate=30:duration=1" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=1" \
            -f lavfi -i "sine=frequency=880:sample_rate=48000:duration=1" \
            -map 0:v:0 -map 1:a:0 -map 2:a:0 \
            -c:v libx264 -pix_fmt yuv420p -c:a aac \
            -disposition:a:0 0 -disposition:a:1 default \
            -metadata:s:a:0 title="Programa Principal" \
            -metadata:s:a:0 language=por \
            -metadata:s:a:1 title="Audio Descricao Futuro" \
            -metadata:s:a:1 language=por \
            -shortest /tmp/santtos-media/multiaudio.mp4

      - name: Validate analyzer and decoder fallback matrix
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const path = require('node:path');
          const { probeMedia } = require('./src/core/media/ffprobe');
          const { checkMediaDecode } = require('./src/core/media/decode-check');

          const files = [
            'h264.mp4',
            'ffv1.mkv',
            'prores.mov',
            'mpeg2.ts',
            'mpeg4.avi',
            'multiaudio.mp4'
          ];

          (async () => {
            for (const name of files) {
              const file = path.join('/tmp/santtos-media', name);
              const metadata = await probeMedia(file);
              const decode = await checkMediaDecode(file, metadata.videoStreamIndex);

              if (!decode.decodable) {
                throw new Error(`${name}: decoder preflight failed`);
              }
              if (metadata.status === 'incompatible') {
                throw new Error(`${name}: analyzer marked file incompatible`);
              }

              console.log(
                `[matrix] ${name} | ${metadata.container} | ${metadata.videoCodec}` +
                ` | ${metadata.width}x${metadata.height} | ${metadata.fps}fps` +
                ` | decoder=${decode.preferredMode}`
              );
            }

            const multi = await probeMedia('/tmp/santtos-media/multiaudio.mp4');

            if (multi.audioStreamCount !== 2) {
              throw new Error(`Expected 2 audio tracks, got ${multi.audioStreamCount}`);
            }
            if (multi.audioStreamOrdinal !== 0 || multi.primaryAudioTrack !== 0) {
              throw new Error('Audio 01 was not selected as primary');
            }
            if (multi.audioTracks?.[0]?.channelLabel !== 'Áudio 01') {
              throw new Error('Audio 01 metadata was not cataloged correctly');
            }
            if (multi.audioTracks?.[1]?.default !== true) {
              throw new Error('Test fixture did not mark Audio 02 as default');
            }
            if (multi.audioTracks?.[0]?.role !== 'program') {
              throw new Error('Audio 01 role must be program');
            }

            console.log('[matrix] Audio 01 priority validated even with Audio 02 flagged default');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Commit resilient ingest implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f src/database/database.js
          git add src/main/main.js src/renderer/src/App.tsx
          git commit -m "feat: add resilient multi-format ingest with decoder fallback and audio 01 priority"
          git push

# validation rerun after ffprobe recovery changes
