name: Fix Persistent Playout Navigation

on:
  push:
    paths:
      - ".github/workflows/fix-persistent-playout-navigation.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply persistent playout fix
        run: python scripts/fix-persistent-playout-navigation.py

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      - name: Validate persistent mount structure
        shell: pwsh
        run: |
          $content = Get-Content src/renderer/src/App.tsx -Raw
          if ($content -notmatch 'persistent-playout-view') { throw 'Persistent playout wrapper missing' }
          if ($content -match 'activePanel === "playout" && \(\s*<PlayoutPanel') { throw 'Playout is still conditionally mounted' }

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/App.tsx src/renderer/src/styles.css
          git commit -m "fix: keep playout running while navigating between panels"
          git push
