name: Safe Dependency Refresh

on:
  push:
    branches: ["security/review-20260924"]
    paths:
      - ".github/workflows/safe-dependency-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply non-major advisory fixes to package lock
        shell: pwsh
        run: |
          npm audit fix --package-lock-only
          Write-Host "npm audit fix exit code: $LASTEXITCODE (unresolved major advisories are expected)"
          exit 0
      - name: Validate refreshed dependency tree
        run: npm ci
      - name: Backend and frontend regression
        run: npm test
      - name: Playout smoke
        run: npm run stress:smoke
      - name: Commit lockfile only after successful QA
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "fix: refresh nonbreaking vulnerable transitive dependencies"
            git push origin HEAD:security/review-20260924
          fi
