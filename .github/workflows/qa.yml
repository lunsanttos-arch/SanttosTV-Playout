name: Santtos TV QA
on:
  push:
    paths: [".github/workflows/**", "package*.json", "scripts/**", "src/**", "vite.config.*", "tsconfig*.json"]
  pull_request:
    paths: [".github/workflows/**", "package*.json", "scripts/**", "src/**", "vite.config.*", "tsconfig*.json"]
  workflow_dispatch:
jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Backend syntax
        run: |
          node --check src/main/main.js
          node --check src/main/preload.js
      - name: Complete regression suite
        run: npm test
      - name: Accelerated smoke (not a burn-in)
        run: npm run stress:smoke
      - name: Audit includes Electron and build tools
        run: npm audit --audit-level=high
  electron-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install complete Linux media runtime
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Install Electron runtime
        run: npx install-electron --no
      - name: Native PROGRAM integration in disposable profile
        run: xvfb-run -a npm run test:native-integration
      - name: Explorer files into scheduling without library registration
        run: xvfb-run -a node scripts/run-native-qa.cjs --explorer-drop-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-program-qa
          path: build/native-qa/
