name: Santtos TV QA

on:
  push:
    paths:
      - ".github/workflows/qa.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/test-backend.js"
      - "scripts/test-frontend.js"
      - "scripts/test-media-stream.js"
      - "scripts/test-preview-proxy.js"
      - "scripts/test-web-input-playback.js"
      - "scripts/test-exhibition-output.js"
      - "scripts/test-timeline-forecast.js"
      - "scripts/test-output-profile.js"
      - "scripts/test-playout-engine.js"
      - "scripts/test-ndi-audio.js"
      - "scripts/test-ndi-pipe.js"
      - "scripts/test-ndi-frame-aligner.js"
      - "scripts/check-ndi-audio.js"
      - "scripts/start-ndi-testbench.js"
      - "scripts/test-testbench.js"
      - "scripts/start-testbench.js"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/qa.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/test-backend.js"
      - "scripts/test-frontend.js"
      - "scripts/test-media-stream.js"
      - "scripts/test-preview-proxy.js"
      - "scripts/test-web-input-playback.js"
      - "scripts/test-exhibition-output.js"
      - "scripts/test-timeline-forecast.js"
      - "scripts/test-output-profile.js"
      - "scripts/test-playout-engine.js"
      - "scripts/test-ndi-audio.js"
      - "scripts/test-ndi-pipe.js"
      - "scripts/test-ndi-frame-aligner.js"
      - "scripts/check-ndi-audio.js"
      - "scripts/start-ndi-testbench.js"
      - "scripts/test-testbench.js"
      - "scripts/start-testbench.js"
      - "src/**"
      - ".qa-trigger"

jobs:
  backend-and-frontend:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Backend syntax
        run: |
          node --check src/main/main.js
          node --check src/main/preload.js
          node --check src/main/testbench.js
          node --check src/database/database.js
          node --check src/core/library/library-categories.js
          node --check src/core/library/web-inputs.js
          node --check src/core/reporting/playout-report.js
          node --check src/core/graphics/exhibition-overlay.js
          node --check src/core/audio/stereo-meter.js
          node --check src/core/audio/ndi-audio-source.js
          node --check src/core/ndi/ndi-capabilities.js
          node --check src/core/ndi/frame-aligner.js
          node --check src/core/playout/native-playout-engine.js
          node --check src/core/playout/output-profile.js
          node --check src/core/playout/remote-input.js
          node --check src/core/playout/remote-input-resolver.js
          node --check src/core/playout/remote-input-proxy.js
          node --check src/core/playout/vlc-input-bridge.js
          node --check src/core/playout/ffmpeg-stream-map.js
          node --check src/core/media/web-input-preview.js

      - name: Security regression tests
        run: npm run test:security

      - name: Isolated testbench regression tests
        run: npm run test:testbench

      - name: Local media streaming and seeking
        run: npm run test:media-stream

      - name: FFmpeg browser proxy
        run: npm run test:proxy

      - name: Web input HLS playback
        run: npm run test:web-input

      - name: VLC Input bridge regression
        run: npm run test:vlc-input

      - name: NDI editorial overlay render regression
        run: npm run test:exhibition-output

      - name: Live entry-time forecasting regression
        run: npm run test:timeline-forecast

      - name: Dynamic PROGRAM output profile regression
        run: npm run test:output-profile

      - name: Native playout engine state regression
        run: npm run test:playout-engine

      - name: NDI raw-video frame boundary regression
        run: npm run test:ndi-video

      - name: Native NDI PCM stereo source and meter regression
        run: npm run test:ndi-audio

      - name: Backend regression tests
        run: npm run test:backend

      - name: Frontend typecheck and regression tests
        run: npm run test:frontend

      - name: Playout smoke stress
        run: npm run stress:smoke

      # Segurança continua sendo um gate, mas roda por último para não
      # esconder falhas funcionais e de TypeScript.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
