name: Wire Broadcast Settings UI

on:
  push:
    paths:
      - ".github/workflows/patch-broadcast-settings-ui.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch App settings panel
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/renderer/src/App.tsx")
          text = path.read_text(encoding="utf-8")

          import_anchor = 'import type { CSSProperties } from "react";\n'
          import_line = 'import BroadcastSettingsPanel from "./BroadcastSettingsPanel";\n'
          if import_line not in text:
              text = text.replace(
                  import_anchor,
                  import_anchor + import_line,
                  1,
              )

          old = '''                    {activePanel === "settings" && (\n                        <HashtagSettingsPanel\n                            hashtagStyle={hashtagStyle}\n                            onSave={saveHashtagStyle}\n                        />\n                    )}'''
          new = '''                    {activePanel === "settings" && (\n                        <BroadcastSettingsPanel\n                            hashtagStyle={hashtagStyle}\n                            onSaveHashtag={saveHashtagStyle}\n                        />\n                    )}'''

          if old not in text:
              raise SystemExit("Settings panel anchor not found")

          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

      - name: Commit renderer integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/App.tsx
          git commit -m "feat: integrate broadcast output settings panel"
          git push
