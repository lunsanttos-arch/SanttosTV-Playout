name: Add Film Block Editor

on:
  push:
    paths:
      - ".github/workflows/add-film-block-editor.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply film block editor migration
        run: python scripts/add-film-block-editor.py

      - name: Install dependencies
        run: npm ci

      - name: Validate backend syntax
        run: |
          node --check src/main/main.js
          node --check src/database/database.js

      - name: Build renderer
        run: npm run build:renderer

      - name: Validate FFmpeg IN OUT clipping
        shell: pwsh
        run: |
          $ffmpeg = node -p "require('ffmpeg-static')"
          & $ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=size=640x360:rate=30:duration=6" -c:v libx264 -pix_fmt yuv420p "$env:RUNNER_TEMP\film.mp4"
          & $ffmpeg -hide_banner -loglevel error -ss 1.500 -i "$env:RUNNER_TEMP\film.mp4" -t 2.000 -frames:v 60 -f null -
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg IN/OUT clip validation failed" }

      - name: Commit feature
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/renderer/src/App.tsx src/renderer/src/styles.css src/main/main.js
          git add -f src/database/database.js
          git commit -m "feat: add non-destructive film block editor with IN OUT playout"
          git push
