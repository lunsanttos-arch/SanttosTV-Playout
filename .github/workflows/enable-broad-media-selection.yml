name: Enable Broad Media Selection

on:
  push:
    paths:
      - ".github/workflows/enable-broad-media-selection.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply media selection patch
        run: python scripts/enable-broad-media-selection.py
      - name: Install dependencies
        run: npm ci
      - name: Validate backend
        run: |
          node --check src/main/main.js
          node --check src/core/media/ffprobe.js
      - name: Build renderer
        run: npm run build:renderer
      - name: Commit media compatibility changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/main.js
          git commit -m "feat: enable MKV and broad container selection in media library"
          git push
