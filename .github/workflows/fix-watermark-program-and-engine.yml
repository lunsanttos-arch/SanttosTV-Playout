name: Fix Watermark PROGRAM And Engine

on:
  push:
    paths:
      - ".github/workflows/fix-watermark-program-and-engine.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply patch
        run: python scripts/fix-watermark-program-and-engine.py

      - name: Install dependencies
        run: npm ci

      - name: Validate backend syntax
        run: |
          node --check src/main/main.js
          node --check src/main/preload.js

      - name: Build renderer
        run: npm run build:renderer

      - name: Execute real FFmpeg watermark fade test
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG="$(node -p "require('ffmpeg-static')")"
          "$FFMPEG" -hide_banner -loglevel error -f lavfi -i "color=c=red:s=320x160:d=0.1" -frames:v 1 /tmp/watermark.png
          "$FFMPEG" -hide_banner -loglevel error \
            -f lavfi -i "color=c=blue:s=1920x1080:r=30000/1001:d=1" \
            -loop 1 -framerate 30000/1001 -i /tmp/watermark.png \
            -filter_complex "[0:v]scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30000/1001[base];[1:v]scale=180:-1,format=rgba,colorchannelmixer=aa=0.82,fade=t=in:st=0:d=0.2:alpha=1,fade=t=out:st=0.8:d=0.2:alpha=1[wm];[base][wm]overlay=x=100:y=50:shortest=1:repeatlast=1[program]" \
            -map "[program]" -frames:v 30 -f null -

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main/main.js src/renderer/src/App.tsx src/renderer/src/styles.css
          git commit -m "fix: render watermark and intelligent fades in PROGRAM and NDI"
          git push
