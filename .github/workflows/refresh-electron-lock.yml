name: Refresh Electron and UUID Lockfile

on:
  push:
    branches: ["security/review-20260924"]
    paths:
      - ".github/workflows/refresh-electron-lock.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Resolve security updates
        run: npm install --package-lock-only --ignore-scripts
      - name: Reinstall clean lockfile
        run: npm ci
      - name: Full regression
        run: npm test
      - name: Media stress
        run: npm run stress:smoke
      - name: Dependency audit
        shell: pwsh
        run: |
          npm audit --json | Set-Content -Encoding utf8 audit-after-upgrade.json
          node -e "const a=require('./audit-after-upgrade.json'); console.log('AUDIT RESULT',JSON.stringify(a.metadata.vulnerabilities));"
          exit 0
      - name: Commit lockfile after validation
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "security: lock verified Electron and uuid patch versions"
            git push origin HEAD:security/review-20260924
          fi
