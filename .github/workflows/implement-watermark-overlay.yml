          graph = r'''function buildFadeAlphaExpression(
    fadeIn,
    fadeOut,
    remainingSeconds,
    fadeSeconds
) {
    const safeFade = Math.max(0, Number(fadeSeconds) || 0);
    const safeRemaining = Math.max(0, Number(remainingSeconds) || 0);

    if (safeFade <= 0) {
        return "1";
    }

    const parts = [];

    if (fadeIn) {
        parts.push(
            `if(lt(t\\,${safeFade.toFixed(3)})\\,t/${safeFade.toFixed(3)}\\,1)`
        );
    }

    if (fadeOut && safeRemaining > safeFade) {
        const fadeStart = Math.max(
            0,
            safeRemaining - safeFade
        );
        parts.push(
            `if(gt(t\\,${fadeStart.toFixed(3)})\\,max(0\\,(${safeRemaining.toFixed(3)}-t)/${safeFade.toFixed(3)})\\,1)`
        );
    }

    if (parts.length === 0) {
        return "1";
    }

    if (parts.length === 1) {
        return parts[0];
    }

    return `min(${parts[0]}\\,${parts[1]})`;
}

function buildProgramFilterGraph(
    hashtag,
    overlayState,
    hasWatermarkInput
) {
    const state = overlayState && typeof overlayState === "object"
        ? overlayState
        : {};
    const durationSeconds = Number(state.durationSeconds) || 0;
    const startSeconds = Number(state.startSeconds) || 0;
    const remainingSeconds = Math.max(
        0,
        durationSeconds - startSeconds
    );

    const chains = [
        "[0:v]scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:black,setsar=1,fps=30000/1001[base]"
    ];

    let currentLabel = "base";

    if (hasWatermarkInput) {
        const wm = getSettings().watermarkStyle;
        const fadeSeconds = Math.max(
            0,
            Number(wm.fadeMs) / 1000
        );
        const watermarkFilters = [
            `scale=${Math.round(wm.widthPx)}:-1`,
            "format=rgba",
            `colorchannelmixer=aa=${Math.max(0, Math.min(1, Number(wm.opacity) || 0)).toFixed(3)}`
        ];

        if (state.watermarkFadeIn && fadeSeconds > 0) {
            watermarkFilters.push(
                `fade=t=in:st=0:d=${fadeSeconds.toFixed(3)}:alpha=1`
            );
        }

        if (
            state.watermarkFadeOut &&
            remainingSeconds > fadeSeconds &&
            fadeSeconds > 0
        ) {
            watermarkFilters.push(
                `fade=t=out:st=${Math.max(0, remainingSeconds - fadeSeconds).toFixed(3)}:d=${fadeSeconds.toFixed(3)}:alpha=1`
            );
        }

        chains.push(
            `[1:v]${watermarkFilters.join(",")}[wm]`
        );
        chains.push(
            `[${currentLabel}][wm]overlay=x=${Math.round(wm.x)}:y=${Math.round(wm.y)}:shortest=1[watermarked]`
        );
        currentLabel = "watermarked";
    }

    const normalizedHashtag =
        typeof hashtag === "string"
            ? hashtag.trim()
            : "";

    if (normalizedHashtag) {
        const style = getSettings().hashtagStyle;
        const fadeSeconds = 0.2;
        const alphaExpression = buildFadeAlphaExpression(
            Boolean(state.hashtagFadeIn),
            Boolean(state.hashtagFadeOut),
            remainingSeconds,
            fadeSeconds
        );
        const options = [
            `fontfile='${resolveHashtagFont(style)}'`,
            `text='${escapeDrawtextText(normalizedHashtag)}'`,
            `x=${Math.round(style.x)}`,
            `y=${Math.round(style.y)}`,
            `fontsize=${Math.round(style.fontSize)}`,
            `fontcolor=${toFfmpegColor(style.color, style.opacity)}`,
            `borderw=${Math.round(style.outlineWidth)}`,
            `bordercolor=${toFfmpegColor(style.outlineColor, style.outlineOpacity)}`,
            `alpha='${alphaExpression}'`
        ];

        if (style.shadowEnabled) {
            options.push(
                `shadowcolor=${toFfmpegColor(style.shadowColor, style.shadowOpacity)}`,
                `shadowx=${Math.round(style.shadowX)}`,
                `shadowy=${Math.round(style.shadowY)}`
            );
        }

        chains.push(
            `[${currentLabel}]drawtext=${options.join(":")}[program]`
        );
        currentLabel = "program";
    }

    if (currentLabel !== "program") {
        chains.push(`[${currentLabel}]null[program]`);
    }

    return chains.join(";");
}
'''
